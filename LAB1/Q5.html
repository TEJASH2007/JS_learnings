// Que      :   What is <noscript> html element? How is it useful?
//
// Ans      :   noscript is html element , only becomes active when JS is disabled.
//              
// Remark   :   We can place this tag in body 
//              We can place this element also inside the head tag
// Syntax   :   <noscript> </noscript>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <noscript>
        <style>
            body{
                background-color : black;
            }
        </style>
    </noscript>
</head>
<body>
    <noscript>
        <h1>Please enable the JS to use the website effectively</h1>
    </noscript>
</body>
</html>
